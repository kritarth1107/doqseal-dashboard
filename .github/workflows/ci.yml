# Runs lint, typecheck and tests on pull requests.
name: CI

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint on changed files
        run: |
          # Get list of changed .ts/.tsx/.js/.jsx files (excluding deleted ones)
          CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx')
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No lintable files changed, skipping ESLint"
            exit 0
          fi
          
          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          
          # Write files to a temp file and use xargs with proper quoting
          echo "$CHANGED_FILES" | while IFS= read -r file; do
            printf '%s\0' "$file"
          done | xargs -0 npx eslint --max-warnings 50

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm test
